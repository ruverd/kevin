name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: target/x86_64-unknown-linux-musl/release/kevin
          - os: macos-latest
            executable: target/release/kevin
          - os: windows-latest
            executable: target/release/kevin.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p kevin --locked -- eval
      - name: Build and verify the static Linux executable
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build -p kevin --release --locked --target x86_64-unknown-linux-musl
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/${{ matrix.executable }},target=/kevin,readonly" \
            ubuntu:20.04 /kevin eval
      - if: runner.os != 'Linux'
        run: cargo build -p kevin --release --locked
      - run: ./${{ matrix.executable }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: kevin-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --workspace --all-targets --locked
