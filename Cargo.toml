[workspace]
members = ["crates/kevin-core", "crates/kevin-cli"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ruverd/kevin"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
